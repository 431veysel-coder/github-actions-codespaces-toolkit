name: Android Production Build Pipeline (Nexus OS v3.0)

on:
  push:
    branches: [ "main", "master", "release/*" ]
    paths:
      - 'app/src/**'
      - 'app/build.gradle*'
      - 'build.gradle*'
      - 'settings.gradle*'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build Variant'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
        - both
      produce_aab:
        description: 'Build Android App Bundle (.aab) for Google Play'
        required: false
        default: true
        type: boolean
      run_emulator_tests:
        description: 'Run Headless Emulator UI / Instrument Tests'
        required: false
        default: true
        type: boolean

jobs:
  preflight-and-matrix-build:
    name: Matrix Build & Security Audit (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 50

    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
        java-version: [17]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Compliance & Secret Leak Scanner
      run: |
        python3 -c "
        import re, glob
        forbidden = [r'AIza[0-9A-Za-z-_]{35}', r'ghp_[0-9A-Za-z]{36}']
        for f in glob.glob('**/*', recursive=True):
            if os.path.isfile(f) and not f.startswith('.git/'):
                try:
                    txt = open(f, errors='ignore').read()
                    for p in forbidden:
                        if re.search(p, txt):
                            raise Exception(f'CRITICAL: Secret pattern matched in {f}')
                except Exception as e:
                    if 'CRITICAL' in str(e): raise
        print('Secret Leak Audit Passed!')
        "
      continue-on-error: true

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '${{ matrix.java-version }}'
        cache: 'gradle'

    - name: Advanced Gradle Caching
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Android SDK Tools
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew

    - name: Dynamic Version Bumping
      run: |
        python3 scripts/android_pipeline/version_bumper.py . || true

    - name: Secure Keystore Extraction (Release Only)
      if: ${{ matrix.variant == 'release' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
        fi

    - name: Build APK with Automatic Retry (Variant: ${{ matrix.variant }})
      uses: nick-invision/retry@v3
      with:
        timeout_minutes: 25
        max_attempts: 3
        command: |
          if [ "${{ matrix.variant }}" = "debug" ]; then
            ./gradlew assembleDebug --parallel --build-cache --stacktrace
          else
            ./gradlew assembleRelease --parallel --build-cache --stacktrace
          fi

    - name: Build Android App Bundle (.aab) for Google Play
      if: ${{ matrix.variant == 'release' && inputs.produce_aab != false }}
      run: |
        ./gradlew bundleRelease --parallel --build-cache --stacktrace || true

    - name: Secure Cleanup of Keystore
      if: always() && matrix.variant == 'release'
      run: |
        rm -f app/release-keystore.jks

    - name: Headless Emulator UI / Instrumentation Tests
      if: ${{ matrix.variant == 'debug' && inputs.run_emulator_tests != false }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: default
        arch: x86_64
        profile: pixel_6
        script: ./gradlew connectedDebugAndroidTest --stacktrace
      continue-on-error: true

    - name: Upload Build Artifacts (Retention Guard: 7 Days)
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ matrix.variant }}-artifacts
        path: |
          app/build/outputs/apk/${{ matrix.variant }}/*.apk
          app/build/outputs/bundle/${{ matrix.variant }}/*.aab
        retention-days: 7
        if-no-files-found: ignore
