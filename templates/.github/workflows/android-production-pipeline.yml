name: Android Production Build Pipeline (Nexus OS)

on:
  push:
    branches: [ "main", "master", "release/*" ]
    paths:
      - 'app/src/**'
      - 'app/build.gradle*'
      - 'build.gradle*'
      - 'settings.gradle*'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build Variant'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release
        - both
      run_lint:
        description: 'Run Static Analysis (Lint/Detekt)'
        required: false
        default: true
        type: boolean

jobs:
  preflight-and-matrix-build:
    name: Matrix Build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
        java-version: [17]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '${{ matrix.java-version }}'
        cache: 'gradle'

    - name: Advanced Gradle Caching
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Android SDK Tools
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Grant Execute Permission to Gradle Wrapper
      run: chmod +x gradlew

    - name: Pre-build Hook - Lint & Static Analysis
      if: ${{ inputs.run_lint != false }}
      run: |
        ./gradlew lintDebug || true

    - name: Secure Keystore Extraction (Release Only)
      if: ${{ matrix.variant == 'release' }}
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
          echo "Keystore successfully decoded for signing."
        else
          echo "Warning: ANDROID_KEYSTORE_BASE64 secret not found. Proceeding unsigned/debug fallback."
        fi

    - name: Build with Automatic Retry (Variant: ${{ matrix.variant }})
      uses: nick-invision/retry@v3
      with:
        timeout_minutes: 20
        max_attempts: 3
        command: |
          if [ "${{ matrix.variant }}" = "debug" ]; then
            ./gradlew assembleDebug --parallel --build-cache --stacktrace
          else
            ./gradlew assembleRelease --parallel --build-cache --stacktrace
          fi

    - name: Secure Cleanup of Keystore
      if: always() && matrix.variant == 'release'
      run: |
        rm -f app/release-keystore.jks
        echo "Keystore securely wiped from runner disk."

    - name: Post-build APK Size & Metric Profiling
      run: |
        python3 -c "
        import glob, os
        apks = glob.glob('app/build/outputs/apk/**/*.apk', recursive=True)
        for apk in apks:
            size_mb = round(os.path.getsize(apk) / (1024 * 1024), 2)
            print(f'PROFILER OUTPUT -> APK: {apk} | Size: {size_mb} MB')
        "

    - name: Upload Build Artifacts (${{ matrix.variant }})
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ matrix.variant }}-apk
        path: app/build/outputs/apk/${{ matrix.variant }}/*.apk
        if-no-files-found: ignore
