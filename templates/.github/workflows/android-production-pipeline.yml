# Android Production Pipeline — Production-Grade Build Workflow
# Generated by GitHub Actions & Codespaces Toolkit (Nexus OS)
# 
# Usage:
#   1. Copy this file to your repo at .github/workflows/android-production-pipeline.yml
#   2. Configure secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#   3. Configure variables: ANDROID_SDK_ROOT, GRADLE_VERSION (optional)
#   4. Run manually or on push/PR

name: Android Production Pipeline

on:
  push:
    branches: [ "main", "master", "release/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "release/**" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [debug, release, both]
        default: "both"
      api_levels:
        description: "API levels to test (comma-separated)"
        type: string
        default: "24,28,31,34"
      skip_tests:
        description: "Skip instrumented tests"
        type: boolean
        default: false

env:
  # Build configuration
  GRADLE_VERSION: "8.5"
  JAVA_VERSION: "17"
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"
  
  # Artifact retention
  ARTIFACT_RETENTION_DAYS: 7

jobs:
  # ========================================================================
  # PRE-FLIGHT CHECKS
  # ========================================================================
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      gradle_wrapper_valid: ${{ steps.gradle.outputs.valid }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version bumping

      - name: Detect project type
        id: detect
        run: |
          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            echo "project_type=native" >> $GITHUB_OUTPUT
          elif [ -f "pubspec.yaml" ]; then
            echo "project_type=flutter" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ] && grep -q "react-native" package.json; then
            echo "project_type=react-native" >> $GITHUB_OUTPUT
          elif [ -f "settings.gradle.kts" ] && grep -q "com.android.kotlin-multiplatform" settings.gradle.kts; then
            echo "project_type=kmp" >> $GITHUB_OUTPUT
          else
            echo "project_type=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_COMPILE_SDK }}
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          accept-sdk-license: true

      - name: Validate Gradle Wrapper
        id: gradle
        run: |
          if [ ! -f "gradlew" ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "::error::Gradle wrapper (gradlew) not found"
            exit 1
          fi
          if ! ./gradlew --version >/dev/null 2>&1; then
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "::error::Gradle wrapper validation failed"
            exit 1
          fi
          echo "valid=true" >> $GITHUB_OUTPUT

      - name: Verify Android Manifest
        run: |
          MANIFEST=$(find . -name "AndroidManifest.xml" -path "*/src/main/*" | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml not found in src/main"
            exit 1
          fi
          # Check for debuggable=true in release
          if grep -q 'android:debuggable="true"' "$MANIFEST"; then
            echo "::warning::Manifest has debuggable=true"
          fi
          # Check for allowBackup=false (recommended)
          if ! grep -q 'android:allowBackup="false"' "$MANIFEST"; then
            echo "::warning::Consider setting android:allowBackup=\"false\" for security"
          fi

      - name: Dependency Verification (Checksums)
        run: |
          if [ -f "gradle/verification-metadata.xml" ]; then
            echo "Dependency verification metadata found - will verify on build"
          else
            echo "::warning::No dependency verification metadata (gradle/verification-metadata.xml)"
            echo "Run './gradlew --write-verification-metadata sha256' to generate"
          fi

  # ========================================================================
  # BUILD MATRIX (Debug + Release, Multiple API Levels)
  # ========================================================================
  build:
    name: Build (${{ matrix.build_type }}, API ${{ matrix.api_level }})
    needs: preflight
    if: needs.preflight.outputs.gradle_wrapper_valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [debug, release]
        api_level: [24, 28, 31, 34]
        include:
          # Only run instrumented tests on API 34 for release
          - build_type: release
            api_level: 34
            run_tests: true
          - build_type: debug
            api_level: 34
            run_tests: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ matrix.api_level }}
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          accept-sdk-license: true
          emulator: ${{ matrix.run_tests == true && 'true' || 'false' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Gradle Properties
        run: |
          cat >> gradle.properties << EOF
          android.enableJetifier=true
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.caching=true
          kotlin.code.style=official
          EOF

      - name: Build APK/AAB
        run: |
          if [ "${{ matrix.build_type }}" = "release" ]; then
            ./gradlew assembleRelease bundleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Run Unit Tests
        run: ./gradlew test --continue
        continue-on-error: true

      - name: Run Instrumented Tests (API ${{ matrix.api_level }})
        if: matrix.run_tests == true && ${{ github.event.inputs.skip_tests != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew connectedAndroidTest

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build_type }}-apk-api${{ matrix.api_level }}
          path: |
            **/build/outputs/apk/${{ matrix.build_type }}/*.apk
            **/build/outputs/bundle/${{ matrix.build_type }}/*.aab
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.build_type }}-api${{ matrix.api_level }}
          path: |
            **/build/reports/tests/**/*.xml
            **/build/outputs/androidTest-results/**/*.xml
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Profile APK Size
        if: matrix.build_type == 'release' && matrix.api_level == 34
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*release*" | head -1)
          AAB_PATH=$(find . -name "*.aab" -path "*release*" | head -1)
          if [ -f "$APK_PATH" ]; then
            echo "APK: $APK_PATH"
            unzip -l "$APK_PATH" | tail -5
            # DEX count
            unzip -p "$APK_PATH" classes.dex > /tmp/classes.dex 2>/dev/null || true
            if [ -f /tmp/classes.dex ]; then
              echo "DEX files: $(unzip -l "$APK_PATH" | grep -c classes.dex || echo 1)"
            fi
          fi
          if [ -f "$AAB_PATH" ]; then
            echo "AAB: $AAB_PATH"
          fi

  # ========================================================================
  # SECURITY SCANNING
  # ========================================================================
  security:
    name: Security Scanning
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Detekt (Static Analysis)
        run: |
          if [ -f "detekt.yml" ] || [ -f "config/detekt/detekt.yml" ]; then
            ./gradlew detekt --continue
          else
            echo "No detekt config found, skipping"
          fi
        continue-on-error: true

      - name: Run Android Lint
        run: ./gradlew lint --continue
        continue-on-error: true

      - name: Dependency Vulnerability Scan (OWASP)
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: "Android App"
          path: "."
          format: "HTML"
          out: "reports"
          args: >
            --failOnCVSS 7
            --suppressionFiles suppression.xml
        continue-on-error: true

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            **/build/reports/detekt/**
            **/build/reports/lint-results*.html
            reports/**
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ========================================================================
  # RELEASE SIGNING (Only on tag push or manual dispatch)
  # ========================================================================
  sign-release:
    name: Sign Release Artifacts
    needs: [build, security]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # For creating release
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-api34
          path: artifacts
          merge-multiple: true

      - name: Verify Keystore Secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Missing keystore secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
            exit 1
          fi

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "Keystore decoded: $(ls -lh release.keystore)"

      - name: Sign APK/AAB
        run: |
          for file in artifacts/*.apk artifacts/*.aab; do
            if [ -f "$file" ]; then
              echo "Signing $file..."
              jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
                -keystore release.keystore \
                -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
                -keypass "${{ secrets.KEY_PASSWORD }}" \
                "$file" "${{ secrets.KEY_ALIAS }}"
              echo "Signed: $file"
            fi
          done

      - name: Zipalign APKs
        run: |
          for file in artifacts/*.apk; do
            if [ -f "$file" ]; then
              zipalign -v -p 4 "$file" "${file%.apk}-aligned.apk"
              mv "${file%.apk}-aligned.apk" "$file"
              echo "Zipaligned: $file"
            fi
          done

      - name: Verify Signatures
        run: |
          for file in artifacts/*.apk artifacts/*.aab; do
            if [ -f "$file" ]; then
              apksigner verify --verbose "$file"
            fi
          done

      - name: Generate Release Checksums
        run: |
          cd artifacts
          sha256sum *.apk *.aab > CHECKSUMS.txt 2>/dev/null || true
          cat CHECKSUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            artifacts/*.apk
            artifacts/*.aab
            artifacts/CHECKSUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Signed Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-artifacts
          path: artifacts/**
          retention-days: 30

  # ========================================================================
  # SIZE ANALYSIS & REGRESSION DETECTION
  # ========================================================================
  size-analysis:
    name: APK Size Analysis
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          pattern: debug-*-api34
          path: debug-artifacts
          merge-multiple: true

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-api34
          path: release-artifacts
          merge-multiple: true

      - name: Analyze APK Size
        run: |
          DEBUG_APK=$(find debug-artifacts -name "*.apk" | head -1)
          RELEASE_APK=$(find release-artifacts -name "*.apk" | head -1)
          
          if [ -f "$DEBUG_APK" ]; then
            DEBUG_SIZE=$(stat -c%s "$DEBUG_APK")
            echo "Debug APK size: $((DEBUG_SIZE / 1024)) KB"
            echo "debug_size_kb=$((DEBUG_SIZE / 1024))" >> $GITHUB_OUTPUT
          fi
          
          if [ -f "$RELEASE_APK" ]; then
            RELEASE_SIZE=$(stat -c%s "$RELEASE_APK")
            echo "Release APK size: $((RELEASE_SIZE / 1024)) KB"
            echo "release_size_kb=$((RELEASE_SIZE / 1024))" >> $GITHUB_OUTPUT
          fi

      - name: Size Regression Check
        if: github.event_name == 'pull_request'
        run: |
          # Compare with base branch (main)
          echo "Size regression check would compare with base branch"
          # TODO: Implement comparison with main branch artifacts

  # ========================================================================
  # NOTIFICATION & SUMMARY
  # ========================================================================
  notify:
    name: Build Summary & Notification
    needs: [build, security, sign-release, size-analysis]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect Build Status
        run: |
          echo "Build Status Summary:"
          echo "Pre-flight: ${{ needs.preflight.result }}"
          echo "Build (Debug API 34): ${{ needs.build.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Sign Release: ${{ needs.sign-release.result }}"
          echo "Size Analysis: ${{ needs.size-analysis.result }}"

      - name: Create Build Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Android Build Summary
          
          | Job | Status | Duration |
          |-----|--------|----------|
          | Pre-flight | ${{ needs.preflight.result }} | ${{ needs.preflight.duration }} |
          | Build (Debug) | ${{ needs.build.result }} | ${{ needs.build.duration }} |
          | Security Scan | ${{ needs.security.result }} | ${{ needs.security.duration }} |
          | Sign Release | ${{ needs.sign-release.result }} | ${{ needs.sign-release.duration }} |
          | Size Analysis | ${{ needs.size-analysis.result }} | ${{ needs.size-analysis.duration }} |
          
          **Artifacts:** Available in workflow run artifacts for ${{ env.ARTIFACT_RETENTION_DAYS }} days
          
          **Triggered by:** ${{ github.event_name }} (${{ github.ref }})
          **Commit:** ${{ github.sha }}
          EOF

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Build failed! Check workflow run for details."
          # Add Slack/Discord/Telegram notification here if configured

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          # Add success notification here if configured