# App Factory — Fully Automated Android Build Pipeline
# Copy to your repo as .github/workflows/android-build.yml
# Produces: unsigned debug APK, (optional) signed release APK/AAB via repo secrets

name: App Factory Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: app-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (with cache — quota protection)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Pre-flight (Level 1 verification)
        run: |
          ./gradlew --version
          test -f app/build.gradle.kts || test -f app/build.gradle || { echo "::error::app module gradle file missing"; exit 1; }

      - name: Lint
        run: ./gradlew lint --stacktrace || echo "::warning::lint issues found (non-blocking)"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace || echo "::warning::unit test failures (non-blocking)"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release (unsigned unless secrets present)
        id: release
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/release.keystore \
              -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} --stacktrace
            rm -f release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            ./gradlew assembleRelease --stacktrace || echo "::warning::release build skipped"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload Release APK
        if: steps.release.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build size report
        run: |
          echo "## 📦 Build Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for f in app/build/outputs/apk/*/*.apk; do
            [ -f "$f" ] || continue
            SIZE=$(du -h "$f" | cut -f1)
            echo "- \`$(basename $(dirname $(dirname $f)))/$(basename $f)\` → **$SIZE**" >> "$GITHUB_STEP_SUMMARY"
          done

  # Auto-release on version tags (v*) — release pipeline completes the factory
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-debug-apk/*.apk
            dist/app-release-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
