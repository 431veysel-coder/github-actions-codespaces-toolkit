name: Toolkit CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite (unit + contract + security + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        run: python3 tests/test_suite.py

      - name: Coverage report (non-blocking)
        run: |
          pytest tests/ --cov=scripts --cov=mcp_server -q || true

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black isort flake8
      - name: black
        run: black --check --diff .
      - name: isort
        run: isort --check-only --diff .
      - name: flake8
        run: flake8 .

  validate-mcp:
    name: Validate MCP Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Import server and count tools
        run: |
          cat > /tmp/validate_mcp.py <<'PY'
          import sys
          sys.path.insert(0, "mcp_server")
          sys.path.insert(0, "scripts/android_pipeline")
          import server

          tools = server.app._tool_manager.list_tools()
          names = sorted(t.name for t in tools)
          print(f"Tools registered: {len(names)}")
          print(", ".join(names))
          assert len(names) >= 39, f"expected >=39 tools, got {len(names)}"
          nexus = [n for n in names if "nexus" in n]
          assert not nexus, f"legacy nexus tools still registered: {nexus}"
          for required in ("create_android_project", "build_android_project",
                           "create_github_release", "diff_artifacts",
                           "install_apk_on_device", "keystore_generate"):
              assert required in names, f"missing tool: {required}"
          print("MCP server OK")
          PY
          python3 /tmp/validate_mcp.py

  verify-docs:
    name: Verify Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          for f in README.md LICENSE CONTRIBUTING.md SECURITY.md SKILL.md \
                   ANDROID_PIPELINE.md CHANGELOG.md requirements.txt \
                   templates/.github/workflows/android-app-factory.yml \
                   .github/PULL_REQUEST_TEMPLATE.md; do
            test -f "$f" && echo "✓ $f" || { echo "✗ missing $f"; exit 1; }
          done
      - name: No legacy Nexus scaffolding
        run: |
          # 1) the old workflow file must be gone
          if [ -f .github/workflows/nexus-android-build.yml ]; then
            echo "::error::legacy nexus-android-build.yml still present"
            exit 1
          fi
          # 2) no leftover module/app references in code or docs.
          #    CHANGELOG.md is excluded on purpose: it is the historical record
          #    of what was removed and must keep naming the old scaffolding.
          HITS=$(grep -rIl -i -e "nexus_builder" -e "NEXUS_ULTRA" -e "minis-nexus" \
                    scripts/ mcp_server/ tests/ templates/ \
                    README.md SKILL.md ANDROID_PIPELINE.md DESIGN_LAYOUT.md 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::legacy Nexus references remain:"
            echo "$HITS"
            exit 1
          fi
          echo "✓ no legacy Nexus references"

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t github-actions-codespaces-toolkit:latest .

  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, validate-mcp, verify-docs]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate changelog
        run: python3 scripts/android_pipeline/changelog_automator.py "${GITHUB_REF_NAME}" || true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: CHANGELOG.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
