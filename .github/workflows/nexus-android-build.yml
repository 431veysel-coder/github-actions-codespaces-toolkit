name: Nexus Android Build Pipeline

on:
  push:
    branches: [ master, main ]
    paths:
      - 'apps/minis-nexus/**'
      - '.github/workflows/nexus-android-build.yml'
  pull_request:
    paths:
      - 'apps/minis-nexus/**'

jobs:
  build-nexus:
    name: Build Minis Nexus APK (Optimized for Quota)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: apps/minis-nexus

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle Wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Cache Gradle Dependencies & Caches (Quota Protection)
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/minis-nexus/.gradle/buildOutputCleanup
          key: ${{ runner.os }}-gradle-nexus-${{ hashFiles('apps/minis-nexus/**/*.gradle*', 'apps/minis-nexus/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-nexus-

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew || true

      - name: Pre-flight Local Lint & Verification (Level 1 Check)
        run: |
          echo "Running pre-flight checks..."
          if [ -f "gradlew" ]; then
            ./gradlew --version
          else
            echo "Gradle wrapper not found yet, will be generated or synced."
          fi

      - name: Build Debug APK (assembleDebug)
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Error: gradlew missing."
            exit 1
          fi

      - name: Archive Built APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-Nexus-Debug-APK
          path: apps/minis-nexus/app/build/outputs/apk/debug/*.apk
          retention-days: 14
